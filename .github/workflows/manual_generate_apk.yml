Name: Manual Generate Android APK
on:
  workflow_dispatch:

jobs:
  apk:
    name: Generate NormalOptimized APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Check Valid Version Tags
        id: valid-tags
        shell: bash
        run: |
          echo "count=$(git tag -l 'v[0-9]*' | wc -l | tr -d ' ')" >> $GITHUB_OUTPUT

      - name: Fetch upstream tags
        if: steps.valid-tags.outputs.count == '0'
        run: |
          git remote add upstream https://github.com/hrydgard/ppsspp.git
          git fetch --deepen=15000 --no-recurse-submodules --tags --force upstream || exit 0
        
      - name: Setup JDK
        uses: actions/setup-java@v6.0.0
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Assemble Single ARM64 APK
        run: |
          ./gradlew :android:assembleNormalOptimized \
            -Pandroid.injected.build.abi.arm64-v8a \
            --parallel \
            --build-cache \
            --no-daemon \
            -x test \
            -x lint

      - name: Package build
        run: |
          mkdir -p ppsspp
          find android/build/outputs/apk -name "*.apk" -type f -exec cp {} ppsspp/ \;
          echo "APK file packaged:"
          ls -lh ppsspp/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-NormalOptimized-arm64-apk
          path: ppsspp/
          retention-days: 30
          if-no-files-found: error
