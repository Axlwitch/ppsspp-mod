name: Manual Generate Android APK
on:
  workflow_dispatch:
    inputs:
      buildVariant:
        type: choice
        description: 'Build Variant'
        required: true
        default: 'NormalOptimized'
        options: 
        - NormalOptimized
        - NormalDebug
        - VROptimized
        - VRDebug
        - LegacyOptimized

jobs:
  apk:
    name: Generate ${{ github.event.inputs.buildVariant }} APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Check Valid Version Tags
        id: valid-tags
        shell: bash
        run: |
          echo "count=$(git tag -l 'v[0-9]*' | wc -l | tr -d ' ')" >> $GITHUB_OUTPUT

      - name: Fetch upstream tags
        if: steps.valid-tags.outputs.count == '0'
        run: |
          git remote add upstream https://github.com/hrydgard/ppsspp.git
          git fetch --deepen=15000 --no-recurse-submodules --tags --force upstream || exit 0
        
      - name: Setup JDK
        uses: actions/setup-java@v6.0.0
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Test androidGitVersion
        run: |
          echo "count=${{steps.valid-tags.outputs.count}}"
          gradle --quiet androidGitVersion
      
      - name: Assemble APK
        run: |
          ./gradlew assemble${{ github.event.inputs.buildVariant }} \
            --stacktrace \
            --parallel \
            --max-workers=4 \
            -x lint \
            -x bundleRelease \
            -x testDebug \
            --build-cache \
            --daemon
      
      - name: Package build
        run: |
          mkdir -p ppsspp
          find android/build -name "*${{ github.event.inputs.buildVariant }}*.apk" -type f -exec cp {} ppsspp/ \;
          echo "APK files packaged:"
          ls -lh ppsspp/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-${{ github.event.inputs.buildVariant }}-apk
          path: ppsspp/
          retention-days: 30
          if-no-files-found: error
